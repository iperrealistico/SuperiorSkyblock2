mission-file: ItemsMissions
island: true
auto-reward: false
reset-after-finish: false
required-items:
  stone:
    types: [STONE]
    amount: 2
rewards:
  commands:
    - 'is admin rankup %player% pvc-native'
    - 'is admin msgall %player% PVC_NATIVE_MISSION_REWARD'
icons:
  not-completed:
    type: PAPER
    name: PVC native command item delivery
  can-complete:
    type: PAPER
    name: PVC native command item delivery ready
  completed:
    type: MAP
    name: PVC native command item delivery complete
