name: PVC source verification
on:
  pull_request:
  push:
    branches: [pvc/main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pvc-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: |
            8
            11
            17
            21
            25
      - name: Verify source, dependencies and all retained adapters
        shell: pwsh
        run: |
          $taskSocketDir = Join-Path $env:RUNNER_TEMP 'pvc-unix'
          [void][IO.Directory]::CreateDirectory($taskSocketDir)
          $env:JAVA_TOOL_OPTIONS = "-Djdk.net.unixdomain.tmpdir=$taskSocketDir -XX:ActiveProcessorCount=2"
          $taskJdks = @($env:JAVA_HOME_8_X64,$env:JAVA_HOME_11_X64,$env:JAVA_HOME_17_X64,$env:JAVA_HOME_21_X64,$env:JAVA_HOME_25_X64) -join ','
          ./gradlew.bat --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx1536m -XX:ActiveProcessorCount=2' "-Dorg.gradle.java.installations.paths=$taskJdks" :test :checkDebug :shadowJar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python verification/scripts/inspect-artifact.py target/SuperiorSkyblock2-2026.3-pvc.1.jar
          exit $LASTEXITCODE
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pvc-source-diagnostics
          path: |
            build/test-results/test
            build/reports/tests/test
          if-no-files-found: ignore
