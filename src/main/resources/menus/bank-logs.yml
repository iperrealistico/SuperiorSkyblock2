title: '&6&lTransaction Logs &r&7{0}'
previous-menu: true

pattern:
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '$ $ $ ! $ - $ $ $'
  - '# # % # * # ^ # #'

slots: '@'
previous-page: '%'
current-page: '*'
next-page: '^'

time-sort: '!'
money-sort: '-'

items:
  '@':
    type: PAPER
    name: '&6Transaction #{0}'
    lore:
      - '&7Player: {1}'
      - '&7Status: {2}'
      - '&7Time: {3}'
      - '&7Amount: ${4}'
      - ''
      - '&7Click to filter transactions by this player.'
  '%':
    type: PAPER
    name: '{0}Previous Page'
  '*':
    type: DOUBLE_PLANT
    name: '&6Current Page'
    lore:
      - '&7Page {0}'
  '^':
    type: PAPER
    name: '{0}Next Page'
  '$':
    type: STAINED_GLASS_PANE
    data: 15
    name: '&8'
  '!':
    type: WATCH
    name: '&6Sort by creation time'
  '-':
    type: EMERALD
    name: '&6Sort by money'

sounds:
  '@':
    type: CHEST_OPEN
    volume: 0.8
    pitch: 1